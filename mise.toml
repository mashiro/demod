[tools]
go = "1.27.2"
goreleaser = "2.18.3"
"golangci-lint" = "2.14.0"

[tasks.build]
run = "go build ./cmd/demod/"

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.release-check]
run = "goreleaser check"

[tasks.release-snapshot]
run = "goreleaser release --snapshot --clean"
